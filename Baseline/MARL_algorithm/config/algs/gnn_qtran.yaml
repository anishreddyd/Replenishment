# ======== Evaluation and Logging ========
test_greedy: True
test_nepisode: 32
test_interval: 50000
log_interval: 5000
visualize: False                        # Whether to visualize the policy
visualize_interval: 500000                # Visualize the policy for every visualize_interval iterations
learner_log_interval: 10000           # ADDED: For consistent logging with the baseline.
checkpoint_path: ""                     # If not empty, load a mac checkpoint from this path
save_model: True
save_model_interval: 1460000
local_results_path: "results"
use_wandb: True
wandb_project_name: "whittle_index"
use_tensorboard: False

# ======== Sampling ========
# Using a large buffer and high parallelism, critical for off-policy QTRAN
runner: "parallel"
batch_size: 16
batch_size_run: 16
buffer_size: 200
buffer_cpu_only: True

# ======== Algorithm ========
name: "gnn_qtran"
run: "qtran_run" # Use the QTRAN runner
use_cuda: True
seed: 101
t_max: 5020000

# --- Action Selection (Standard for Q-learning) ---
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000
save_probs: False

# --- Learner & Mixer (The core of QTRAN) ---
learner: "qtran_learner"
mixer: "qtran_base"
qtran_arch: "qtran_paper"
network_size: "small"
mixing_embed_dim: 64
opt_loss: 1
nopt_min_loss: 0.1
use_double_q: True
target_update_interval: 200

# --- Controller & Agent (The Novel Hybrid Part) ---
mac: "dqn_mac" # Standard controller for value-based agents
agent: "gnn_rnn" # UPDATED: Your GNN agent is the new component.
agent_output_type: "q" # CRITICAL: Tells the GNN agent to output Q-values.
actor_input_seq_str: "o_la_ma" # UPDATED: Provide the GNN with local, action, and mean-field info.
obs_last_action: True
obs_agent_id: False
hidden_dim: 128
whittle_hidden_dim: 128
use_layer_norm: False                   # ADDED: Explicitly match the QTRAN baseline setting.
use_orthogonal: False                   # ADDED: Explicitly match the QTRAN baseline setting.

# --- Optimization & Hyperparameters (A blend of best practices) ---
accumulated_episodes: 8
gamma: 0.985
optim: "Adam"
lr: 4.5e-05 # UPDATED: Using the proven stable LR from your PPO tuning for the more complex GNN agent.
use_lr_decay: True # ADDED: A proven stability enhancement from your PPO runs.
optim_alpha: 0.99
optim_eps: 0.00001
grad_norm_clip: 1.0 # UPDATED: A stricter clip is safer for the more complex GNN architecture.
mini_epochs: 1                          # ADDED: QTRAN is off-policy and typically uses 1 epoch. This is crucial to include.
use_n_lambda: False                     # Whether to learn the Q values for different lambdas
n_lambda: 51                            # How many lambdas to use;

# --- Reward & Normalization ---
use_individual_rewards: True
use_mean_team_reward: False
use_reward_normalization: True
use_loss_normalization: False           # ADDED: Explicitly match the QTRAN baseline setting.
use_sample_prob_weights: True # Kept: This is a specific part of the QTRAN algorithm's off-policy correction.
use_per: true
debug_mode: False